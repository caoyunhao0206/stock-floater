name: update-market-data
# 设计说明：
# GitHub 免费层的 schedule 对这个新仓库延迟严重（实测延迟 3 小时以上，甚至不触发），
# 所以不再依赖"每 5 分钟触发一次"，改为一早触发一次、任务内部循环到收盘。
# 只要 09:00-10:30 之间 cron 命中一次，整个交易日就能持续更新并推送。

on:
  schedule:
    # GitHub 免费层的 schedule 经常延迟 30 分钟到 3 小时，甚至整天不触发。
    # 对策：不赌某一次，改成一整天撒网——北京 08:50 起每 20 分钟一次机会，
    # 只要任意一次落地，任务内部就会循环到 14:50，覆盖整个交易日。
    - cron: "50 0 * * 1-5"        # 北京 08:50 预热
    - cron: "*/20 1-8 * * 1-5"    # 北京 09:00-16:40，每 20 分钟一次
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 已有实例在跑就跳过（避免排队积压）
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep $((RANDOM % 20))
          n=$(gh run list --workflow=update.yml --status=in_progress --limit 20 --json databaseId \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length" 2>/dev/null || echo 0)
          if [ "$n" -gt 0 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "已有 $n 个实例在跑，本次直接退出"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        if: steps.guard.outputs.skip != '1'
        run: pip install -r requirements-server.txt

      - name: Intraday loop
        if: steps.guard.outputs.skip != '1'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: |
          git config user.name "stock-floater-bot"
          git config user.email "actions@users.noreply.github.com"
          n=0
          while true; do
            n=$((n+1))
            echo "========== 第 $n 轮  $(date +'%H:%M:%S') =========="
            # 只取网页刚同步过来的 watchlist，不动其他文件，避免 rebase 卡住
            timeout 60 git fetch -q origin main 2>/dev/null || echo "!! fetch 失败，沿用本地配置"
            timeout 30 git checkout -q origin/main -- watchlist.json 2>/dev/null || true

            # 单轮硬超时（13 分钟）：跨境访问慢，正常一轮 6~8 分钟，卡住也不会拖死整个任务
            timeout 780 python build_static.py || echo "!! 本轮构建超时或失败，稍后重试"

            # 先把 HEAD 对齐远端（工作区文件保留），这样 push 永远是快进
            timeout 60 git fetch -q origin main 2>/dev/null || true
            git reset --soft origin/main 2>/dev/null || true
            git add docs/data/
            if git diff --staged --quiet; then
              echo "数据无变化，跳过提交"
            else
              git commit -q -m "data: $(date +'%m-%d %H:%M')"
              if timeout 90 git push -q; then
                echo "已提交并推送"
              else
                echo "!! 推送失败，下轮重试"
                git reset --soft origin/main 2>/dev/null || true
              fi
            fi

            NOW=$(date +%H%M)
            # 14:50 收尾，给 6 小时上限留余量（9:00 启动 → 约 5 小时 50 分）
            if [ "$NOW" -ge 1450 ] || [ "$NOW" -lt 900 ]; then
              echo "收盘或未开盘（当前 $NOW），结束循环"
              break
            fi
            echo "等待 3 分钟后进入下一轮…"
            sleep 180
          done
