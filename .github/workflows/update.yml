name: update-market-data
# 设计说明：
# GitHub 免费层的 schedule 对这个新仓库延迟严重（实测延迟 3 小时以上，甚至不触发），
# 所以不再依赖"每 5 分钟触发一次"，改为一早触发一次、任务内部循环到收盘。
# 只要 09:00-10:30 之间 cron 命中一次，整个交易日就能持续更新并推送。

on:
  schedule:
    # 北京时间 09:00 / 10:30 / 13:00 三次机会，任意一次命中即可覆盖余下时段
    - cron: "0 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements-server.txt

      - name: Intraday loop
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: |
          git config user.name "stock-floater-bot"
          git config user.email "actions@users.noreply.github.com"
          n=0
          while true; do
            n=$((n+1))
            echo "========== 第 $n 轮  $(date +'%H:%M:%S') =========="
            # 拉一下远端：网页里点「一键同步」刚提交的 watchlist.json 要能立刻生效
            if ! git pull --rebase -q origin main; then
              git rebase --abort 2>/dev/null || true
              echo "!! 同步远端失败，本轮沿用本地配置"
            fi
            python build_static.py || echo "!! 本轮构建失败，稍后重试"

            git add docs/data/
            if git diff --staged --quiet; then
              echo "数据无变化，跳过提交"
            else
              git commit -q -m "data: $(date +'%m-%d %H:%M')"
              if git push -q; then
                echo "已提交并推送"
              else
                echo "!! 推送失败，下轮重试"
                git reset --soft HEAD~1
              fi
            fi

            NOW=$(date +%H%M)
            # 14:50 收尾，给 6 小时上限留余量（9:00 启动 → 约 5 小时 50 分）
            if [ "$NOW" -ge 1450 ] || [ "$NOW" -lt 900 ]; then
              echo "收盘或未开盘（当前 $NOW），结束循环"
              break
            fi
            echo "等待 3 分钟后进入下一轮…"
            sleep 180
          done
